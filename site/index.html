<title>IPO Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Fonts ship with the app so it works offline. Devanagari falls back to the system font. */
@font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 300 700; font-display: swap; src: url(fonts/SpaceGrotesk.woff2) format("woff2"); }

/* ------------------------------------------------------------------ tokens --
   Calm, high-contrast surfaces; the brand's teal and gold from the radar icon;
   one meaning per colour (green = good, amber = careful, red = against you). */
:root {
  --scale: 1;
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eef2f6; --surface-3: #e4eaf0;
  --ink: #0b1b2b; --ink-2: #3f5064; --muted: #66768a;
  --hair: rgba(11,27,43,.09); --hair-2: rgba(11,27,43,.16);
  --brand: #0e7c86; --brand-ink: #0a6069; --brand-soft: #dcf0f1; --on-brand: #ffffff;
  --navy: #0b2540; --gold: #e6a817; --gold-soft: #fdf3d8;
  --good: #137a3a; --good-fill: #1fa855; --good-soft: #dcf5e4;
  --warn: #9a5208; --warn-fill: #f0a020; --warn-soft: #fdf0d6;
  --crit: #b3261e; --crit-fill: #e5483d; --crit-soft: #fde4e1;
  --info: #2a5db0; --info-soft: #e3ecfb;
  --series-main: #2f6fde; --series-sme: #e8730c; --grid: #e3e8ee; --axis: #c3ccd6;
  --font: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
  --num: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px; --r-lg: 22px; --r-pill: 999px;
  --shadow: 0 1px 2px rgba(11,27,43,.05), 0 6px 20px -10px rgba(11,27,43,.18);
  --shadow-lift: 0 2px 6px rgba(11,27,43,.07), 0 18px 40px -16px rgba(11,27,43,.3);
  --ease: cubic-bezier(.2,.8,.2,1);
  --top-h: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07111b; --surface: #0e1a26; --surface-2: #152332; --surface-3: #1c2d3f;
    --ink: #eaf1f7; --ink-2: #b1c0cf; --muted: #8394a7;
    --hair: rgba(255,255,255,.08); --hair-2: rgba(255,255,255,.15);
    --brand: #2cc0ca; --brand-ink: #67d9e0; --brand-soft: rgba(44,192,202,.15); --on-brand: #04252a;
    --navy: #0b2540; --gold: #f5c04a; --gold-soft: rgba(245,192,74,.14);
    --good: #5ad88a; --good-fill: #27b862; --good-soft: rgba(39,184,98,.16);
    --warn: #f6bd55; --warn-fill: #f0a020; --warn-soft: rgba(240,160,32,.15);
    --crit: #ff8a80; --crit-fill: #ef5346; --crit-soft: rgba(239,83,70,.16);
    --info: #8fb4f5; --info-soft: rgba(90,140,230,.16);
    --series-main: #6b9cf0; --series-sme: #f59a48; --grid: #1a2837; --axis: #2b3c4f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -12px rgba(0,0,0,.6);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.45), 0 22px 44px -16px rgba(0,0,0,.75);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07111b; --surface: #0e1a26; --surface-2: #152332; --surface-3: #1c2d3f;
  --ink: #eaf1f7; --ink-2: #b1c0cf; --muted: #8394a7;
  --hair: rgba(255,255,255,.08); --hair-2: rgba(255,255,255,.15);
  --brand: #2cc0ca; --brand-ink: #67d9e0; --brand-soft: rgba(44,192,202,.15); --on-brand: #04252a;
  --navy: #0b2540; --gold: #f5c04a; --gold-soft: rgba(245,192,74,.14);
  --good: #5ad88a; --good-fill: #27b862; --good-soft: rgba(39,184,98,.16);
  --warn: #f6bd55; --warn-fill: #f0a020; --warn-soft: rgba(240,160,32,.15);
  --crit: #ff8a80; --crit-fill: #ef5346; --crit-soft: rgba(239,83,70,.16);
  --info: #8fb4f5; --info-soft: rgba(90,140,230,.16);
  --series-main: #6b9cf0; --series-sme: #f59a48; --grid: #1a2837; --axis: #2b3c4f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -12px rgba(0,0,0,.6);
  --shadow-lift: 0 2px 6px rgba(0,0,0,.45), 0 22px 44px -16px rgba(0,0,0,.75);
  color-scheme: dark;
}

/* ------------------------------------------------------------------- base -- */
* { box-sizing: border-box; }
html { font-size: calc(16px * var(--scale)); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1rem; line-height: 1.5; min-height: calc(var(--vh, 1vh) * 100); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
h1 { font-size: 1.75rem; line-height: 1.15; }
h2 { font-size: 1.25rem; line-height: 1.25; }
h3 { font-size: 1.0625rem; line-height: 1.3; }
p { margin: 0; }
a { color: var(--brand-ink); }
button, select, input, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
::selection { background: var(--brand-soft); }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.muted { color: var(--muted); } .ink2 { color: var(--ink-2); }
.small { font-size: .875rem; } .tiny { font-size: .8125rem; }
.good { color: var(--good); } .bad { color: var(--crit); } .careful { color: var(--warn); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; }
.wrapf { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
.stack-lg { display: grid; gap: 22px; align-content: start; min-width: 0; }
.hide { display: none !important; }
html[lang="hi"] body { line-height: 1.6; }

/* ----------------------------------------------------------------- motion -- */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes up { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ring { from { stroke-dashoffset: var(--circ); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: no-preference) {
  .screen:not([hidden]) > * { animation: rise .35s var(--ease) both; }
  .screen:not([hidden]) > *:nth-child(2) { animation-delay: 30ms; } .screen:not([hidden]) > *:nth-child(3) { animation-delay: 60ms; } .screen:not([hidden]) > *:nth-child(4) { animation-delay: 90ms; }
  .sheet { animation: up .3s var(--ease) both; } .sheet-back { animation: fade .2s ease both; }
  .ring circle.v { animation: ring .9s var(--ease) both; }
  .btn, .card, .tab, .chip-btn, .seg button, .icon-btn, .list-row { transition: transform .15s var(--ease), background-color .15s ease, border-color .15s ease, box-shadow .2s ease, color .15s ease; }
  .btn:active, .card.tap:active, .chip-btn:active, .icon-btn:active, .list-row:active { transform: scale(.98); }
}

/* ------------------------------------------------------------------ shell -- */
.app { min-height: calc(var(--vh, 1vh) * 100); }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(160%) blur(12px); -webkit-backdrop-filter: saturate(160%) blur(12px); border-bottom: 1px solid var(--hair); padding-top: env(safe-area-inset-top, 0px); }
.topbar .in { max-width: 1100px; margin: 0 auto; height: var(--top-h); display: flex; align-items: center; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.brand { white-space: nowrap; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.125rem; letter-spacing: -0.02em; background: none; border: 0; padding: 0; color: var(--ink); }
.brand svg { width: 34px; height: 34px; border-radius: 9px; flex: none; }
.topbar .back { display: none; }
.topbar.detail .back { display: inline-flex; }
.topbar.detail .brand span { display: none; }
.fresh { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: var(--r-pill); font-size: .8125rem; font-weight: 600; background: var(--surface-2); color: var(--ink-2); border: 0; white-space: nowrap; max-width: 56vw; overflow: hidden; text-overflow: ellipsis; }
.fresh i { width: 8px; height: 8px; border-radius: 50%; background: var(--good-fill); flex: none; }
.fresh.stale i { background: var(--warn-fill); } .fresh.err i, .fresh.off i { background: var(--crit-fill); }
.fresh.busy i { background: var(--brand); animation: pulse 1s ease infinite; }
.icon-btn { width: 44px; height: 44px; flex: none; display: inline-grid; place-items: center; border-radius: 50%; border: 0; background: transparent; color: var(--ink); }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.spinning svg { animation: spin .9s linear infinite; }
main { max-width: 1100px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.screen { display: grid; gap: 22px; align-content: start; min-width: 0; }
.screen[hidden] { display: none; }
.tabbar { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; background: var(--surface); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px); border-top: 1px solid var(--hair); display: flex; padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
.tab { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; color: var(--muted); font-size: .75rem; font-weight: 600; padding: 6px 2px; border-radius: 14px; }
.tab .ic { width: 56px; height: 30px; border-radius: var(--r-pill); display: grid; place-items: center; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--brand-ink); }
.tab[aria-current="page"] .ic { background: var(--brand-soft); }
.tab .lab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
@media (min-width: 900px) {
  .tabbar { top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); bottom: 0; right: auto; width: 96px; flex-direction: column; justify-content: flex-start; gap: 6px; padding: 16px 8px; border-top: 0; border-right: 1px solid var(--hair); }
  .tab { flex: none; padding: 8px 2px; }
  main { padding-left: 120px; padding-bottom: 60px; }
}

/* -------------------------------------------------------------- surfaces -- */
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.tap { cursor: pointer; text-align: left; width: 100%; color: inherit; }
.card.tap:hover { box-shadow: var(--shadow-lift); border-color: var(--hair-2); }
.card.flat { box-shadow: none; }
.card.tint { background: var(--brand-soft); border-color: transparent; box-shadow: none; }
.card h3 + p, .card h2 + p { margin-top: 4px; }
.sec { display: grid; gap: 12px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-h .link { font-size: .9375rem; font-weight: 600; color: var(--brand-ink); background: none; border: 0; padding: 6px 0; white-space: nowrap; }
.sec-sub { color: var(--ink-2); font-size: .9375rem; margin-top: -6px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.divider { height: 1px; background: var(--hair); margin: 4px 0; }
.empty { text-align: center; padding: 28px 18px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty svg { width: 44px; height: 44px; stroke: var(--axis); fill: none; stroke-width: 1.6; }
.note { border-radius: var(--r); padding: 12px 14px; font-size: .9375rem; display: flex; gap: 10px; align-items: flex-start; }
.note svg { width: 20px; height: 20px; flex: none; margin-top: 1px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.note.warn { background: var(--warn-soft); color: var(--ink); } .note.warn svg { color: var(--warn); }
.note.crit { background: var(--crit-soft); color: var(--ink); } .note.crit svg { color: var(--crit); }
.note.info { background: var(--info-soft); color: var(--ink); } .note.info svg { color: var(--info); }
.note.good { background: var(--good-soft); color: var(--ink); } .note.good svg { color: var(--good); }

/* ---------------------------------------------------------------- buttons -- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: var(--r-pill); border: 1px solid var(--hair-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: .9375rem; text-decoration: none; text-align: center; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.soft { background: var(--brand-soft); color: var(--brand-ink); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--brand-ink); }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 6px 14px; font-size: .875rem; }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn[aria-pressed="true"].star { background: var(--gold-soft); color: var(--warn); border-color: transparent; }
.btn.star[aria-pressed="true"] svg { fill: currentColor; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row > .btn { flex: 1 1 auto; }
.coffee { background: #ffdd00; color: #1a1a1a; border-color: transparent; }
.wa { background: #25d366; color: #082b15; border-color: transparent; }
.linkish { background: none; border: 0; padding: 0; color: var(--brand-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* ----------------------------------------------------------- chips, segs -- */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 16px; margin: 0 -16px; -webkit-overflow-scrolling: touch; scroll-padding: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip-btn { flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 8px 15px; border-radius: var(--r-pill); border: 1px solid var(--hair-2); background: var(--surface); color: var(--ink-2); font-size: .9375rem; font-weight: 600; white-space: nowrap; }
.chip-btn .n { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: .75rem; min-width: 22px; padding: 2px 6px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--muted); text-align: center; }
.chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
.chip-btn[aria-pressed="true"] .n { background: rgba(127,127,127,.3); background: color-mix(in srgb, var(--bg) 22%, transparent); color: var(--bg); }
.seg { display: inline-flex; padding: 4px; gap: 2px; border-radius: var(--r-pill); background: var(--surface-2); max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 8px 16px; border-radius: var(--r-pill); color: var(--ink-2); font-weight: 600; font-size: .9375rem; min-height: 38px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg button:disabled { opacity: .45; }
.seg.full { display: flex; } .seg.full button { flex: 1; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink-2); white-space: nowrap; letter-spacing: .01em; }
.tag.sme { background: var(--warn-soft); background: color-mix(in srgb, var(--series-sme) 16%, transparent); color: var(--series-sme); }
.tag.main { background: var(--info-soft); background: color-mix(in srgb, var(--series-main) 14%, transparent); color: var(--series-main); }
.tag.open { background: var(--good-soft); color: var(--good); }
.tag.open::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease infinite; }
.tag.gold { background: var(--gold-soft); color: var(--warn); }
.tag.crit { background: var(--crit-soft); color: var(--crit); }
.search { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--hair-2); border-radius: var(--r-pill); padding: 0 14px; min-height: 46px; }
.search svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
.search input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; font-size: 1rem; padding: 10px 0; }

/* --------------------------------------------------------------- verdicts -- */
.verdict { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; padding: 7px 14px; border-radius: var(--r-pill); font-size: .9375rem; white-space: nowrap; border: 0; }
.verdict .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }
.verdict.apply { background: var(--good-fill); color: #fff; }
.verdict.lean { background: var(--good-soft); color: var(--good); }
.verdict.coinflip { background: var(--warn-soft); color: var(--warn); }
.verdict.avoid { background: var(--crit-soft); color: var(--crit); }
.verdict.watch { background: var(--info-soft); color: var(--info); }
.verdict.nodata, .verdict.done { background: var(--surface-2); color: var(--muted); }
.verdict.lg { font-size: 1.125rem; padding: 10px 18px; }

/* ------------------------------------------------------------------ home -- */
.hello { display: grid; gap: 6px; }
.hello .date { color: var(--muted); font-size: .9375rem; font-weight: 600; }
.hello h1 { font-size: 1.625rem; }
.hello .lede { color: var(--ink-2); font-size: 1.0625rem; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 14px 12px; display: grid; gap: 2px; box-shadow: var(--shadow); text-align: left; color: inherit; min-width: 0; }
.stat .v { font-size: 1.75rem; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em; }
.stat .l { font-size: .8125rem; color: var(--ink-2); font-weight: 600; line-height: 1.3; }
.action { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.action .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--brand-soft); color: var(--brand-ink); }
.action .ico.urgent { background: var(--crit-soft); color: var(--crit); }
.action .ico.gold { background: var(--gold-soft); color: var(--warn); }
.action .ico svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.action .t { font-weight: 700; } .action .s { font-size: .875rem; color: var(--ink-2); }
.action .chev { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
.trust { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; background: linear-gradient(135deg, var(--navy), #11466a); color: #eaf6f7; border: 0; }
.trust .big { font-size: 2rem; font-weight: 700; color: #ffd166; line-height: 1; letter-spacing: -0.03em; }
.trust p { color: #c8dde4; font-size: .9375rem; }
.trust b { color: #fff; }
.trust .btn { background: rgba(255,255,255,.12); color: #fff; border-color: transparent; }
.cal-strip { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 6px; }
.cal-strip::-webkit-scrollbar { display: none; }
.cal-day { flex: none; width: 168px; background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; align-content: start; }
.cal-day .d { font-size: .8125rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.cal-day.today { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
.cal-day .ev { font-size: .875rem; line-height: 1.3; background: none; border: 0; padding: 0; text-align: left; color: var(--ink); }
.cal-day .ev b { display: block; font-size: .75rem; font-weight: 700; color: var(--ink-2); }
.intro { display: grid; gap: 14px; background: linear-gradient(135deg, var(--brand-soft), var(--gold-soft)); border: 0; }
.intro ol { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 12px; counter-reset: s; }
.intro li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; color: var(--ink-2); counter-increment: s; }
.intro li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 700; font-size: .875rem; }
