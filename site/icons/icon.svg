<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f8583"/>
      <stop offset="1" stop-color="#074d4c"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe3dc" stop-opacity="0"/>
      <stop offset="1" stop-color="#7fe3dc" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#round)" fill="none" stroke="#9fe8e3" stroke-opacity="0.35" stroke-width="8">
    <circle cx="256" cy="276" r="72"/>
    <circle cx="256" cy="276" r="140"/>
    <circle cx="256" cy="276" r="208"/>
  </g>
  <!-- sweep: a 70° wedge trailing the beam -->
  <path d="M256 276 L256 60 A216 216 0 0 1 459 202 Z" fill="url(#sweep)" clip-path="url(#round)"/>
  <line x1="256" y1="276" x2="256" y2="58" stroke="#c8f6f2" stroke-width="10" stroke-linecap="round"/>
  <!-- crosshair -->
  <g stroke="#9fe8e3" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="276" x2="472" y2="276"/>
    <line x1="256" y1="60" x2="256" y2="492"/>
  </g>
  <!-- the blip: a rising listing-day candle, lit by the sweep -->
  <g>
    <line x1="340" y1="148" x2="340" y2="298" stroke="#fff4c2" stroke-width="12" stroke-linecap="round"/>
    <rect x="312" y="176" width="56" height="94" rx="12" fill="#ffd54a" stroke="#fff4c2" stroke-width="6"/>
  </g>
  <circle cx="256" cy="276" r="18" fill="#e6fbf9"/>
</svg>
