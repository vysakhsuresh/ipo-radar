<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1aa89c"/><stop offset="1" stop-color="#0b3f52"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dff7f3"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff7a3d"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff" stop-opacity=".45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- rising chart trail -->
  <path d="M80 414 L150 352 L204 372 L268 282 L316 300 L372 176" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M80 414 L150 352 L204 372 L268 282 L316 300 L372 176" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="372" cy="176" r="150" fill="url(#halo)"/>
  <!-- rocket at the end of the line, tilted up-right -->
  <g transform="translate(372 176) rotate(45) scale(1.55)">
    <ellipse cx="0" cy="96" rx="34" ry="60" fill="url(#flame)" filter="url(#soft)"/>
    <path d="M0 -92 C 36 -60 44 -4 40 50 L 20 64 L -20 64 L -40 50 C -44 -4 -36 -60 0 -92 Z" fill="url(#body)" filter="url(#glow)"/>
    <path d="M-40 20 L-72 60 L-36 56 Z" fill="#ffd23f"/><path d="M40 20 L72 60 L36 56 Z" fill="#ffd23f"/>
    <circle cx="0" cy="-10" r="16" fill="#0b6e6d"/><circle cx="0" cy="-10" r="9" fill="#9fe8e3"/>
    <path d="M-22 64 Q0 124 22 64 Z" fill="url(#flame)"/><path d="M-10 64 Q0 96 10 64 Z" fill="#fff6c9"/>
  </g>
  <circle cx="80" cy="414" r="15" fill="#ffd23f"/>
</svg>
