# Refresh the IPO data, re-calibrate the model and commit the result. The Android
# app downloads these committed files on launch and on pull-to-refresh, so this
# job is the app's data feed. Runs on a schedule (market hours, IST) and on demand.
#
# One-time setup: Settings → Actions → General → Workflow permissions: "Read and write"
name: refresh

on:
  schedule:
    # every hour from 09:00 to 18:00 IST (03:30 to 12:30 UTC), Mon-Sat: bidding windows
    - cron: "30 3-12 * * 1-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fetch/**", "model/**", "tools/**", "site/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Headless browser for sites that draw their tables with JavaScript
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
        continue-on-error: true

      - name: Fetch live IPO, GMP, subscription and market data
        # A source that is down must not fail the run; the page shows what is stale.
        run: python -m fetch.run --out data
        continue-on-error: true

      - name: Diagnose the Chittorgarh pages (printed to the log for parser fixes)
        run: python -m fetch.debug
        continue-on-error: true

      - name: Calibrate the model on the listing history
        run: python -m model.calibrate --history data/history.json --out model/params.json

      - name: Score the pipeline and build the site
        run: python -m model.score --ipos data/ipos.json --params model/params.json --out data/scored.json
      - run: python tools/build_site.py --out dist

      - name: Run tests
        run: python -m pytest -q model/tests fetch/tests

      - name: Commit refreshed data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "ipo-radar-bot"
          git config user.email "ipo-radar-bot@users.noreply.github.com"
          git add data model/params.json
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          # someone may have pushed while this ran: rebase our data commit on top and retry
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            sleep 5
          done
